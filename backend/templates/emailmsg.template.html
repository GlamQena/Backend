<div style="
    max-width: 500px;
    margin: 0 auto;
    background-color: #fff5f9;
    border-radius: 12px;
    overflow: hidden;
    font-family: Arial, sans-serif;
">
    <!-- Header -->
    <div style="
        background-color: #ff69b4;
        padding: 18px;
        text-align: center;
    ">
        <h1 style="
            color: #2d1b47;
            font-size: 22px;
            margin: 0;
            font-weight: bold;
        ">
            {subject}
        </h1>
    </div>

    <!-- Body -->
    <div style="
        padding: 27px;
        text-align: center;
    ">
        <p style="
            color: #5a3a7a;
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
        ">
            {message}
        </p>
    </div>
</div>
