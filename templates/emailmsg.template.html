<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{subject}</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #f2e8ff;
      background-color: #07040f;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .container {
      background-color: #1a0e2e;
      border-radius: 28px;
      padding: 30px;
      border: 1px solid rgba(168, 85, 247, 0.22);
      box-shadow: 0 20px 60px rgba(75, 0, 130, 0.50);
    }
    .header {
      text-align: center;
      border-bottom: 2px solid #A855F7;
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    .header h1 {
      color: #A855F7;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    .header .subtitle {
      color: #c8aadf;
      margin-top: 8px;
      font-size: 14px;
    }
    .content {
      text-align: center;
      padding: 10px 0;
    }
    .content p {
      color: #c8aadf;
      font-size: 15px;
      line-height: 1.8;
      margin: 12px 0;
    }
    .content strong {
      color: #f2e8ff;
    }
    .content .highlight {
      color: #FF69B4;
    }
    .message-box {
      background-color: #0e0819;
      border: 1px solid rgba(168, 85, 247, 0.09);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
    }
    .message-box .main-message {
      color: #f2e8ff;
      font-size: 16px;
      font-weight: 500;
      margin: 0;
    }
    .button {
      display: inline-block;
      background: linear-gradient(135deg, #FF69B4, #A855F7);
      color: white !important;
      padding: 12px 28px;
      text-decoration: none !important;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 15px;
      margin: 20px 0;
      box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35);
      transition: all 0.3s ease;
      border: none;
      text-align: center;
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.45);
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #7a5a9a;
      border-top: 1px solid rgba(168, 85, 247, 0.09);
      padding-top: 20px;
      margin-top: 20px;
    }
    .footer .brand {
      color: #A855F7;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>{subject}</h1>
      <div class="subtitle"><span class="highlight">Glam2ena</span></div>
    </div>
    <div class="content">
      <div class="message-box">
        <p class="main-message">{message}</p>
      </div>
    </div>
    <div class="footer">
      <p>This is an automated message from <span class="brand">Glam2ena</span>.</p>
      <p>© {year} Glam2ena. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
